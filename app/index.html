<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Samsung TV Pro</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/themes.css">
</head>
<body data-theme="dark-pro">
  <header class="topbar">
    <div class="brand">Samsung TV <span>Pro</span></div>
    <div class="status">
      <span id="theme-name"></span>
      <time id="clock">--:--</time>
    </div>
  </header>

  <section class="widgets">
    <div class="card prayer">
      <div class="card-head"><span>مواقيت الصلاة · <span id="w-prayer-city"></span></span><b id="w-prayer-next"></b></div>
      <ul id="w-prayer-list"></ul>
    </div>
    <div class="card matches">
      <div class="card-head"><span>المباريات القادمة</span></div>
      <ul id="w-matches-list"></ul>
      <div class="sub" id="w-matches-empty"></div>
    </div>
    <div class="stack">
      <div class="card weather">
        <div class="big"><b id="w-weather-temp">--°</b><span id="w-weather-desc"></span></div>
        <div class="sub" id="w-weather-range"></div>
      </div>
      <div class="card ramadan">
        <div class="big"><b id="w-ramadan-num">--</b><span id="w-ramadan-label"></span></div>
        <div class="sub" id="w-hijri"></div>
      </div>
    </div>
  </section>

  <main>
    <section>
      <h2>المفضّلة</h2>
      <div class="grid" id="pinned"></div>
    </section>
    <section>
      <h2>كل التطبيقات</h2>
      <div class="grid" id="apps"></div>
    </section>
  </main>

  <div class="news"><b id="w-news-src"></b><span id="w-news-title">جارٍ تحميل الأخبار…</span></div>

  <footer class="hints">
    <div class="action" data-action="theme"><i class="key red"></i>تغيير السمة</div>
    <div class="action" data-action="pin"><i class="key green"></i>المفضّلة (ضغط مطوّل على OK)</div>
    <div class="action" data-action="perf"><i class="key yellow"></i>وضع الأداء</div>
    <div class="action" data-action="refresh"><i class="key blue"></i>تحديث القائمة</div>
  </footer>

  <div id="toast" role="status"></div>

  <script src="js/config.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
